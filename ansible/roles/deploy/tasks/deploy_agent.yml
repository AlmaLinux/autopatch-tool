---
- name: Create agent log directory
  file:
    path: /var/log/autopatch
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy agent directory to host
  synchronize:
    src: "../../agent"
    dest: "{{ deploy_source_path }}"

- name: Build agent container image
  command: >
    podman build
    -t {{ deploy_agent_image }}
    -f {{ deploy_source_path }}/agent/Containerfile
    {{ deploy_source_path }}
  register: agent_build
  changed_when: "'COMMIT' in agent_build.stdout"

- name: Create Podman volume for Claude Code auth
  command: podman volume create {{ deploy_agent_auth_volume }}
  register: volume_create
  changed_when: volume_create.rc == 0
  failed_when: false

- name: Check for the Claude Code OAuth token
  ansible.builtin.stat:
    path: "{{ deploy_claude_token_file }}"
  register: claude_token_file

# Only relevant without a token: then the agent still depends on a session
# stored in the volume by an interactive login.
- name: Check for a stored Claude Code session
  command: >
    podman run --rm
    --entrypoint test
    -v {{ deploy_agent_auth_volume }}:/home/agent/.claude
    {{ deploy_agent_image }}
    -s /home/agent/.claude/.credentials.json
  register: auth_check
  changed_when: false
  failed_when: false
  when: not claude_token_file.stat.exists

- name: Warn if the agent has no Claude Code credentials
  debug:
    msg: >
      Claude Code is NOT authenticated: no token at
      {{ deploy_claude_token_file }} and no stored session in the
      {{ deploy_agent_auth_volume }} volume. Either set the vaulted
      claude_code_oauth_token from `claude setup-token` and re-deploy, or log
      in manually on the server:
      podman run -it -v {{ deploy_agent_auth_volume }}:/home/agent/.claude
      --entrypoint claude {{ deploy_agent_image }} login
  when:
    - not claude_token_file.stat.exists
    - auth_check.rc | default(1) != 0

# The check above only proves the credentials file exists. A session can stop
# refreshing while the file stays in place, which is invisible until the next
# package failure needs the agent -- hence the periodic probe.
- name: Create auth probe units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ deploy_systemd_dir }}/{{ item }}"
    owner: root
    group: root
    mode: 0640
    force: yes
  loop:
    - almalinux-autopatch-authcheck.service
    - almalinux-autopatch-authcheck.timer

- name: Enable auth probe timer
  systemd:
    name: almalinux-autopatch-authcheck.timer
    state: started
    enabled: yes
    masked: no
    daemon_reload: yes
