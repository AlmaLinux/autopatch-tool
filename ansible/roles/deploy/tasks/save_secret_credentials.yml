---
- name: Create credentials directories
  file:
    name: "{{ item }}"
    state: directory
    mode: 0600
  with_items:
    - "{{ deploy_home_directory }}/.almalinux-debranding-slack"
    - "{{ deploy_home_directory }}/.cas"

- name: Save Slack token
  template:
    src: "slack_token.yaml.j2"
    dest: "{{ deploy_home_directory }}/.almalinux-debranding-slack/token"
    owner: root
    group: root
    mode: 0600
    force: yes

- name: Save cas credentials
  template:
    src: "cas_credentials.yaml.j2"
    dest: "{{ deploy_home_directory }}/.cas/credentials"
    owner: root
    group: root
    mode: 0600
    force: yes

- name: Save ssh private key
  template:
    src: "ssh_key.j2"
    dest: "{{ deploy_home_directory }}/.ssh/id_rsa"
    owner: root
    group: root
    mode: 0600
    force: yes
  
- name: Save ssh public key
  template:
    src: "ssh_key.pub.j2"
    dest: "{{ deploy_home_directory }}/.ssh/id_rsa.pub"
    owner: root
    group: root
    mode: 0600
    force: yes

# The token lives in its own 0600 file rather than in a unit template: units are
# deployed group-readable and `systemctl cat` would print the secret.
- name: Create the Claude Code token directory
  file:
    path: "{{ deploy_claude_token_dir }}"
    state: directory
    owner: root
    group: root
    mode: 0700

- name: Save the Claude Code OAuth token
  template:
    src: "claude_token.env.j2"
    dest: "{{ deploy_claude_token_file }}"
    owner: root
    group: root
    mode: 0600
    force: yes
  when: claude_code_oauth_token | default('') | trim | length > 0

- name: Warn when no Claude Code OAuth token is configured
  debug:
    msg: >
      claude_code_oauth_token is empty: an existing
      {{ deploy_claude_token_file }} on the host is left untouched, otherwise
      the agent falls back to the session stored in the
      {{ deploy_agent_auth_volume }} volume. To use a token, run
      `claude setup-token` on a workstation with a Claude subscription and put
      the result into the vaulted claude_code_oauth_token.
  when: claude_code_oauth_token | default('') | trim | length == 0
